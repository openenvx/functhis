name: Bug report
description: Report unexpected CLI or gateway behavior
title: '[bug] '
labels: ['bug']
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Functhis version
      placeholder: output of `fn --version`
